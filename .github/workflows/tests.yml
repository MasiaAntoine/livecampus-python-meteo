name: Run Pytest on Push to Production

on:
  push:
    branches:
      - production

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Create .env file
        run: |
          echo "MYSQL_HOST=db" >> .env
          echo "MYSQL_USER=meteo_user" >> .env
          echo "MYSQL_PASSWORD=meteo_password" >> .env
          echo "MYSQL_ROOT_PASSWORD=meteo_root_password" >> .env
          echo "MYSQL_DATABASE=meteo_db" >> .env
          echo "API_PORT=8000" >> .env
          echo "DB_PORT=3306" >> .env
          echo "OPEN_METEO_BASE_URL=https://api.open-meteo.com/v1" >> .env
          echo "NOMINATIM_BASE_URL=https://nominatim.openstreetmap.org/search" >> .env

      - name: Start Docker services
        run: |
          docker compose up -d db
          docker compose up -d api

      - name: Wait for services to start
        run: sleep 30

      - name: Run tests
        run: |
          docker compose exec api sh -c "pip install pytest && pytest"

      - name: Cleanup
        if: always()
        run: docker compose down -v