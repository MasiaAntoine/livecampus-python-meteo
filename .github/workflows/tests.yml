name: Run Pytest on Push to Production

on:
  push:
    branches:
      - production

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: meteo_db
          MYSQL_USER: meteo_user
          MYSQL_PASSWORD: meteo_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for MySQL to be ready
        run: |
          while ! mysqladmin ping -h"127.0.0.1" --silent; do
            echo "Waiting for database connection..."
            sleep 2
          done

      - name: Run database migrations
        run: |
          # Ajoutez ici les commandes pour exécuter vos migrations de base de données
          echo "Database migrations would run here"

      - name: Start API server
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Check if API server is running
        run: |
          curl --fail http://127.0.0.1:8000 || (echo "API server is not running" && exit 1)

      - name: Run tests
        env:
          DB_PORT: 3306
          MYSQL_HOST: 127.0.0.1
        run: |
          pytest